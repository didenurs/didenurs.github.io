<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rich Deep Cyber Emerald Gradient (Darker, Harmonious & Elegant) -->
    <linearGradient id="deepEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Subtle Glow Shadow for Monogram -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Deep Cyber Emerald Fill -->
  <rect x="16" y="16" width="480" height="480" rx="118" ry="118" fill="url(#deepEmerald)"/>

  <!-- Subtle Emerald Rim Bevel -->
  <rect x="16" y="16" width="480" height="480" rx="118" ry="118" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.35"/>

  <!-- Code Monogram: < D /> in Harmonious Cyber Mint (#6ee7b7) -->
  <g filter="url(#softGlow)">
    <!-- Left Bracket: < -->
    <polyline points="134,178 82,256 134,334" 
              fill="none" 
              stroke="#6ee7b7" 
              stroke-width="38" 
              stroke-linecap="round" 
              stroke-linejoin="round"/>

    <!-- Central Monogram: D -->
    <path d="M 168 168 L 220 168 C 275 168 308 198 308 256 C 308 314 275 344 220 344 L 168 344 Z 
             M 206 204 L 216 204 C 248 204 268 222 268 256 C 268 290 248 308 216 308 L 206 308 Z" 
          fill="#6ee7b7" 
          fill-rule="evenodd"/>

    <!-- Slash: / -->
    <line x1="328" y1="168" x2="298" y2="344" 
          stroke="#6ee7b7" 
          stroke-width="34" 
          stroke-linecap="round"/>

    <!-- Right Bracket: > -->
    <polyline points="368,178 420,256 368,334" 
              fill="none" 
              stroke="#6ee7b7" 
              stroke-width="38" 
              stroke-linecap="round" 
              stroke-linejoin="round"/>
  </g>
</svg>
