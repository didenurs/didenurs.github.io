<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Radiant Cyber Emerald & Teal Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="55%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Top Gloss Arc -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Crisp Subtle Drop Shadow for Floating 3D Feel -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#022c22" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="118" ry="118" fill="url(#bgGrad)"/>

  <!-- Inner Glass Bevel Highlight -->
  <rect x="16" y="16" width="480" height="480" rx="118" ry="118" fill="none" stroke="#ffffff" stroke-width="8" stroke-opacity="0.32"/>

  <!-- Subtle Top Gloss -->
  <path d="M 16 134 C 16 75 75 16 134 16 L 378 16 C 437 16 496 75 496 134 C 496 175 390 195 256 195 C 122 195 16 175 16 134 Z" fill="url(#glossGrad)"/>

  <!-- Code Monogram: < D /> -->
  <g filter="url(#softShadow)">
    <!-- Left Bracket: < -->
    <polyline points="134,178 82,256 134,334" 
              fill="none" 
              stroke="#ffffff" 
              stroke-width="38" 
              stroke-linecap="round" 
              stroke-linejoin="round"/>

    <!-- Central Monogram: D -->
    <path d="M 168 168 L 220 168 C 275 168 308 198 308 256 C 308 314 275 344 220 344 L 168 344 Z 
             M 206 204 L 216 204 C 248 204 268 222 268 256 C 268 290 248 308 216 308 L 206 308 Z" 
          fill="#ffffff" 
          fill-rule="evenodd"/>

    <!-- Slash: / -->
    <line x1="328" y1="168" x2="298" y2="344" 
          stroke="#ffffff" 
          stroke-width="34" 
          stroke-linecap="round"/>

    <!-- Right Bracket: > -->
    <polyline points="368,178 420,256 368,334" 
              fill="none" 
              stroke="#ffffff" 
              stroke-width="38" 
              stroke-linecap="round" 
              stroke-linejoin="round"/>
  </g>
</svg>
